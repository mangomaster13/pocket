name: Invest daily

on:
  schedule:
    # Beijing 14:40 = UTC 06:40 (before 15:00 close)
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      skip_delivery:
        description: "Skip Bark push"
        type: boolean
        required: false
        default: false

jobs:
  run-invest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGES_BASE_URL: https://mangomaster13.github.io/pocket
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      BARK_DEVICES: ${{ secrets.BARK_DEVICES }}
      BARK_KEY_daj: ${{ secrets.BARK_KEY_daj }}
      BARK_KEY_lzx: ${{ secrets.BARK_KEY_lzx }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
      BARK_ICON: ${{ secrets.BARK_ICON }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate invest brief (no Bark yet)
        run: npm run run:job -- --job invest-daily --skip-delivery

      - name: Build Pocket Hub site
        run: npm run site

      - name: Commit notes
        run: |
          git config user.name "pocket bot"
          git config user.email "pocket@users.noreply.github.com"
          git add notes || true
          if git diff --staged --quiet; then
            echo "No note changes to commit"
          else
            git commit -m "chore: add invest brief $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      - name: Bark notify with Pages link
        if: ${{ github.event.inputs.skip_delivery != true && github.event.inputs.skip_delivery != 'true' }}
        run: |
          sleep 15
          npm run notify -- --job invest-daily
