name: Invest daily

# China (Asia/Shanghai, UTC+8, no DST):
#   14:30 generate AI fund watch → site → Pages
#   14:40 Bark push is a separate workflow: invest-notify.yml

# Timed runs: macOS launchd (npm run schedule:install). Manual backup only:
on:
  workflow_dispatch:

jobs:
  run-invest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGES_BASE_URL: https://mangomaster13.github.io/pocket
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      BARK_DEVICES: ${{ secrets.BARK_DEVICES }}
      BARK_KEY_daj: ${{ secrets.BARK_KEY_daj }}
      BARK_KEY_lzx: ${{ secrets.BARK_KEY_lzx }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
      BARK_ICON: ${{ secrets.BARK_ICON }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate invest brief (no Bark)
        run: npm run run:job -- --job invest-daily --skip-delivery

      - name: Build Pocket Hub site
        run: npm run site

      - name: Commit notes
        run: |
          git config user.name "pocket bot"
          git config user.email "pocket@users.noreply.github.com"
          git add notes || true
          if git diff --staged --quiet; then
            echo "No note changes to commit"
          else
            git commit -m "chore: add invest brief $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
