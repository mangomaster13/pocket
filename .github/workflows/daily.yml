name: Daily digest

on:
  schedule:
    # Beijing 06:00 = UTC 22:00 (previous calendar day in UTC)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job id (default: english-morning)"
        required: false
        default: "english-morning"
      skip_delivery:
        description: "Skip Bark push"
        type: boolean
        required: false
        default: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGES_BASE_URL: https://mangomaster13.github.io/pocket
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      BARK_DEVICES: ${{ secrets.BARK_DEVICES }}
      BARK_KEY_daj: ${{ secrets.BARK_KEY_daj }}
      BARK_KEY_lzx: ${{ secrets.BARK_KEY_lzx }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
      BARK_ICON: ${{ secrets.BARK_ICON }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate note (no Bark yet)
        run: |
          JOB="${{ github.event.inputs.job || 'english-morning' }}"
          npm run run:job -- --job "$JOB" --skip-delivery

      - name: Build site
        run: npm run site

      - name: Commit notes
        run: |
          git config user.name "pocket bot"
          git config user.email "pocket@users.noreply.github.com"
          git add notes || true
          if git diff --staged --quiet; then
            echo "No note changes to commit"
          else
            git commit -m "chore: add daily notes $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      - name: Bark notify with Pages link
        if: ${{ github.event.inputs.skip_delivery != true && github.event.inputs.skip_delivery != 'true' }}
        run: |
          JOB="${{ github.event.inputs.job || 'english-morning' }}"
          # Give Pages a moment to become reachable after deploy.
          sleep 15
          npm run notify -- --job "$JOB"
