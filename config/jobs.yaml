# Daily digest jobs. Add new topics/sources/providers without changing core pipeline code.
#
# Categories (Pages tabs): world / business / tech / dev / music / horror
# Cron times below are documented in local China time for readability;
# GitHub Actions should use UTC equivalents (see .github/workflows/daily.yml).

defaults:
  notesDir: notes
  inboxDir: inbox
  # Truncate Bark body to stay within notification limits
  barkMaxChars: 850

jobs:
  - id: world-daily
    enabled: true
    description: World news English notes
    category: world
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:00"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/world.md
      rssUrl: https://feeds.bbci.co.uk/news/world/rss.xml
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: business-daily
    enabled: true
    description: Business / finance English notes
    category: business
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:05"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/business.md
      rssUrl: https://feeds.bbci.co.uk/news/business/rss.xml
      rssItemCount: 1
    llm:
