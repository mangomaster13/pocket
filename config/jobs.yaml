# Daily digest jobs. Sources live in config/sources.yaml (DailyBrief-style roster).
#
# Categories (Pages tabs): world / business / tech / dev / music / horror
# Cron times below are documented in local China time for readability;
# GitHub Actions should use UTC equivalents (see .github/workflows/daily.yml).

defaults:
  notesDir: notes
  inboxDir: inbox
  # Truncate Bark body to stay within notification limits
  barkMaxChars: 850

jobs:
  - id: world-daily
    enabled: true
    description: World news English notes
    category: world
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:00"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/world.md
      sourceId: bbc-world
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: business-daily
    enabled: true
    description: Business / finance English notes
    category: business
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:05"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/business.md
      # Economist titles; paste full text into inbox for deep reads
      sourceId: economist-finance
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: tech-daily
    enabled: true
    description: Tech / iOS / gadgets English notes
    category: tech
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:10"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/tech.md
      sourceId: 9to5mac
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: dev-daily
    enabled: true
    description: Frontend / web development English notes
    category: dev
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:15"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/dev.md
      sourceId: web-dev
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: music-daily
    enabled: true
    description: Music / Taylor / reviews (inbox preferred)
    category: music
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:20"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/music.md
      sourceId: pitchfork-news
      rssItemCount: 1
      optional: true
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: horror-daily
    enabled: true
    description: Horror film reviews / essays (inbox preferred)
    category: horror
    schedule:
      timezone: Asia/Shanghai
      runAt: "06:25"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/horror.md
      sourceId: bloody-disgusting
      rssItemCount: 1
      optional: true
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true
