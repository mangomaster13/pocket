# Daily digest jobs. Sources live in config/sources.yaml (DailyBrief-style roster).
#
# Pocket Hub apps: articles | invest
# Article categories: world / business / tech / dev / music / horror
# Invest category: invest (watchlist in config/funds.yaml)
# Schedule times below are China local (Asia/Shanghai).
# Actions crons are UTC equivalents in .github/workflows/:
#   Articles generate 07:30 → daily.yml
#   Articles Bark     08:00 → articles-notify.yml
#   Invest generate   14:30 → invest.yml
#   Invest Bark       14:40 → invest-notify.yml

defaults:
  notesDir: notes
  inboxDir: inbox
  # Truncate Bark body to stay within notification limits
  barkMaxChars: 850

jobs:
  - id: world-daily
    enabled: true
    description: World news English notes
    app: articles
    category: world
    schedule:
      timezone: Asia/Shanghai
      runAt: "07:30"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/world.md
      sourceId: bbc-world
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: business-daily
    enabled: true
    description: Business / finance English notes
    app: articles
    category: business
    schedule:
      timezone: Asia/Shanghai
      runAt: "07:30"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/business.md
      # Economist titles; paste full text into inbox for deep reads
      sourceId: economist-finance
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: tech-daily
    enabled: true
    description: Tech / iOS / gadgets English notes
    app: articles
    category: tech
    schedule:
      timezone: Asia/Shanghai
      runAt: "07:30"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/tech.md
      sourceId: 9to5mac
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: dev-daily
    enabled: true
    description: Frontend / web development English notes
    app: articles
    category: dev
    schedule:
      timezone: Asia/Shanghai
      runAt: "07:30"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/dev.md
      sourceId: web-dev
      rssItemCount: 1
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: music-daily
    enabled: true
    description: Music / Taylor / reviews (inbox preferred)
    app: articles
    category: music
    schedule:
      timezone: Asia/Shanghai
      runAt: "07:30"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/music.md
      sourceId: pitchfork-news
      rssItemCount: 1
      optional: true
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: horror-daily
    enabled: true
    description: Horror film reviews / essays (inbox preferred)
    app: articles
    category: horror
    schedule:
      timezone: Asia/Shanghai
      runAt: "07:30"
      pushAt: "08:00"
    topic: english-vocab
    source:
      type: inbox-or-rss
      inboxFile: inbox/horror.md
      sourceId: bloody-disgusting
      rssItemCount: 1
      optional: true
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: english
      appendDate: true

  - id: invest-daily
    enabled: true
    description: Pre-close fund watch (14:30) with A–D buy/sell grades from 分时 + volume
    app: invest
    category: invest
    schedule:
      timezone: Asia/Shanghai
      runAt: "14:30"
      pushAt: "14:40"
    topic: fund-watch
    source:
      type: funds
      fundsFile: config/funds.yaml
      historyDays: 12
    llm:
      provider: cursor-cloud-agent
      model: default
    delivery:
      type: bark
      titlePreset: invest
      appendDate: true
