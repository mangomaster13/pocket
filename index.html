<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pocket Hub</title>
  <style>:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #111111;
  --muted: #8a8a8a;
  --line: #ececec;
  --soft: #f6f8f8;
  --chip: #eef6f5;
  --accent: #0f766e;
  --accent-soft: rgba(15, 118, 110, 0.12);
  --summary: #f5f8ff;
  --summary-border: #3b82f6;
  --card: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111;
    --fg: #f3f3f3;
    --muted: #9a9a9a;
    --line: #2a2a2a;
    --soft: #1a1a1a;
    --chip: #163532;
    --accent: #5eead4;
    --accent-soft: rgba(94, 234, 212, 0.12);
    --summary: #152033;
    --summary-border: #60a5fa;
    --card: #161616;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.65;
  font-size: 15px;
}
a { color: var(--accent); }
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}
.eyebrow {
  color: var(--muted);
  font-size: 0.85rem;
  margin: 0 0 0.35rem;
}
h1 {
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 0.65rem;
  line-height: 1.25;
}
.meta {
  color: var(--muted);
  font-size: 0.92rem;
  margin: 0 0 1rem;
}
.meta a { color: var(--muted); }
.meta a:hover { color: var(--accent); }
.lead {
  font-size: 1.02rem;
  color: var(--fg);
  margin: 0 0 1rem;
  padding: 0.85rem 0 0.85rem 0.9rem;
  border-left: 3px solid var(--accent);
  background: linear-gradient(90deg, var(--accent-soft), transparent 70%);
}
.zh-summary {
  margin: 0 0 1.4rem;
  padding: 0.85rem 1rem;
  background: var(--summary);
  border-left: 3px solid var(--summary-border);
  border-radius: 0 10px 10px 0;
}
.zh-summary .label {
  display: block;
  color: var(--summary-border);
  font-size: 0.8rem;
  font-weight: 650;
  margin-bottom: 0.3rem;
}
.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1rem;
  align-items: center;
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 1.25rem;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.15rem 1.1rem;
  border-bottom: 1px solid var(--line);
  margin: 0 0 0.9rem;
  padding: 0;
  list-style: none;
}
.tabs button {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 0.55rem 0;
  font: inherit;
  color: var(--muted);
  cursor: pointer;
}
.tabs button.active {
  color: var(--fg);
  font-weight: 650;
  border-bottom-color: var(--accent);
}
.tabs .count { color: var(--muted); font-weight: 400; margin-left: 0.25rem; }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  align-items: center;
  margin: 0 0 1.25rem;
}
.filters label {
  color: var(--muted);
  font-size: 0.88rem;
}
.filters select {
  font: inherit;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
}
.list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.9rem;
}
.list > li[hidden] { display: none; }
.card {
  display: block;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.05rem 1.05rem;
  background: var(--card);
}
.card-top {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 0.45rem;
}
.pill {
  display: inline-block;
  font-size: 0.75rem;
  color: var(--accent);
  background: var(--chip);
  border-radius: 999px;
  padding: 0.14rem 0.6rem;
  font-weight: 600;
}
.card-meta {
  color: var(--muted);
  font-size: 0.86rem;
  white-space: nowrap;
}
.card-title {
  font-weight: 700;
  font-size: 1.05rem;
  margin: 0 0 0.4rem;
  line-height: 1.35;
}
.card-lead {
  color: var(--muted);
  font-size: 0.92rem;
  margin: 0 0 0.65rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-zh {
  margin: 0;
  padding: 0.65rem 0.8rem;
  background: var(--summary);
  border-left: 3px solid var(--summary-border);
  border-radius: 0 8px 8px 0;
  font-size: 0.92rem;
}
.card-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.7rem;
}
.card-keys span {
  font-size: 0.78rem;
  color: var(--accent);
  background: var(--chip);
  border-radius: 999px;
  padding: 0.16rem 0.5rem;
}
.empty {
  color: var(--muted);
  padding: 2rem 0;
}
.article-page .top {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: baseline;
  margin-bottom: 1.25rem;
}
.article-page .brand {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.9rem;
}
.article-page .brand:hover { color: var(--accent); }
.article h1 { display: none; }
.article h2 {
  font-size: 1.05rem;
  margin: 1.75rem 0 0.65rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--line);
}
.article ul { padding-left: 1.15rem; }
.article li { margin: 0.3rem 0; }
.article code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.9em;
}
.source-box {
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem 1.05rem;
}
.source-box > :first-child { margin-top: 0; }
.source-box > :last-child { margin-bottom: 0; }
mark.hl-kw {
  background: #fef3c7;
  color: inherit;
  padding: 0 0.15em;
  border-radius: 3px;
}
mark.hl-sent {
  background: #dbeafe;
  color: inherit;
  padding: 0.05em 0.15em;
  border-radius: 3px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
@media (prefers-color-scheme: dark) {
  mark.hl-kw { background: #78350f; }
  mark.hl-sent { background: #1e3a5f; }
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1rem;
  color: var(--muted);
  font-size: 0.82rem;
  margin: 0 0 1.1rem;
}
.legend span::before {
  content: "";
  display: inline-block;
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 2px;
  margin-right: 0.35rem;
  vertical-align: -0.05rem;
}
.legend .kw::before { background: #fef3c7; }
.legend .sent::before { background: #dbeafe; }
@media (prefers-color-scheme: dark) {
  .legend .kw::before { background: #78350f; }
  .legend .sent::before { background: #1e3a5f; }
}
.hub-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.35rem;
}
.hub-brand img {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  object-fit: cover;
}
.hub-apps {
  list-style: none;
  padding: 0;
  margin: 1.5rem 0 0;
  display: grid;
  gap: 0.9rem;
}
.hub-apps a {
  display: block;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.05rem 1.05rem;
  background: var(--card);
}
.hub-apps a:hover { border-color: var(--accent); }
.hub-apps .pill { margin-bottom: 0.45rem; }
.hub-apps h2 {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 0 0 0.35rem;
  line-height: 1.35;
}
.hub-apps p {
  margin: 0;
  color: var(--muted);
  font-size: 0.92rem;
}
.app-switch {
  display: flex;
  gap: 0.85rem;
  font-size: 0.9rem;
}
.app-switch a {
  color: var(--muted);
  text-decoration: none;
}
.app-switch a.active {
  color: var(--fg);
  font-weight: 650;
}
.app-switch a:hover { color: var(--accent); }

/* —— Invest grade badges (A–D) —— */
.invest-page .grade-legend {
  margin: 1.25rem 0 1.5rem;
  padding: 1rem 1.1rem 1.05rem;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.invest-page .grade-legend > h2 {
  margin-top: 0;
}
.invest-page .grade-legend ul {
  list-style: none;
  padding: 0;
  margin: 0.55rem 0 0.9rem;
  display: grid;
  gap: 0.55rem;
}
.invest-page .grade-legend-item {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  margin: 0;
}
.invest-page .grade-legend-text {
  font-size: 0.98rem;
  line-height: 1.45;
}
.invest-page .grade-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0.65rem 0;
  list-style: none;
}
.invest-page .grade-row::marker {
  content: "";
  font-size: 0;
}
.invest-page .grade-label {
  font-weight: 700;
  font-size: 1.05rem;
  min-width: 4.5em;
}
.invest-page .grade-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2.1rem;
  height: 2.1rem;
  padding: 0 0.55rem;
  border-radius: 10px;
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1;
  border: 1.5px solid transparent;
}
.invest-page .grade-row .grade-badge {
  min-width: 2.55rem;
  height: 2.55rem;
  font-size: 1.75rem;
  border-radius: 12px;
}
.invest-page .grade-legend-badge {
  min-width: 1.9rem;
  height: 1.9rem;
  font-size: 1.2rem;
}
.invest-page .grade-a {
  color: #9f1239;
  background: #ffe4e6;
  border-color: #fb7185;
}
.invest-page .grade-b {
  color: #9a3412;
  background: #ffedd5;
  border-color: #fb923c;
}
.invest-page .grade-c {
  color: #854d0e;
  background: #fef9c3;
  border-color: #facc15;
}
.invest-page .grade-d {
  color: #334155;
  background: #e2e8f0;
  border-color: #94a3b8;
}
.invest-page .grade-buy.grade-a {
  color: #065f46;
  background: #d1fae5;
  border-color: #34d399;
}
.invest-page .grade-buy.grade-b {
  color: #0f766e;
  background: #ccfbf1;
  border-color: #2dd4bf;
}
.invest-page .grade-sell.grade-a {
  color: #9f1239;
  background: #ffe4e6;
  border-color: #fb7185;
}
.invest-page .grade-sell.grade-b {
  color: #9a3412;
  background: #ffedd5;
  border-color: #fb923c;
}
@media (prefers-color-scheme: dark) {
  .invest-page .grade-a {
    color: #fecdd3;
    background: #4c0519;
    border-color: #be123c;
  }
  .invest-page .grade-b {
    color: #fed7aa;
    background: #431407;
    border-color: #c2410c;
  }
  .invest-page .grade-c {
    color: #fef08a;
    background: #422006;
    border-color: #a16207;
  }
  .invest-page .grade-d {
    color: #cbd5e1;
    background: #1e293b;
    border-color: #64748b;
  }
  .invest-page .grade-buy.grade-a {
    color: #a7f3d0;
    background: #064e3b;
    border-color: #059669;
  }
  .invest-page .grade-buy.grade-b {
    color: #99f6e4;
    background: #134e4a;
    border-color: #0d9488;
  }
  .invest-page .grade-sell.grade-a {
    color: #fecdd3;
    background: #4c0519;
    border-color: #be123c;
  }
  .invest-page .grade-sell.grade-b {
    color: #fed7aa;
    background: #431407;
    border-color: #c2410c;
  }
}</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Pocket Hub</p>
    <div class="hub-brand">
      <img src="./assets/icon.png" alt="" width="40" height="40" />
      <h1>Pocket Hub</h1>
    </div>
    <p class="meta">选择一个子应用 · 每日文章或每日投资观察</p>
    <ul class="hub-apps">
      <li>
        <a href="./articles/">
          <span class="pill">Articles</span>
          <h2>每日文章</h2>
          <p>英语笔记归档 · 最新 2026-07-31 · 36 篇</p>
        </a>
      </li>
      <li>
        <a href="./invest/">
          <span class="pill">Invest</span>
          <h2>每日投资</h2>
          <p>基金观察与买卖建议 · 最新 2026-07-31 · 6 份</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
